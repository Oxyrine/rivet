# Render blueprint for the Rivet API. The database, login and evidence photos live on Supabase.
# Run exactly one instance: the 60-second scheduler runs inside the process (free plans cannot scale out anyway).
services:
  - type: web
    name: rivet-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    region: singapore
    # Free: sleeps after 15 minutes idle (first request then takes about a minute) and the 60-second scheduler
    # pauses while asleep, catching up on the next tick. For an always-on service switch to a paid size, e.g. 0.5c-512mb.
    plan: free
    healthCheckPath: /health
    envVars:
      # Anything other than demo/test turns off the demo login; only Supabase sign-ins are accepted.
      - key: ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Supabase Postgres connection string (session pooler). Rivet adds the psycopg driver name itself.
      - key: DATABASE_URL
        sync: false
      # base64 of 32 random bytes; generate once, back it up, never change it (see docs/hosting.md).
      - key: RIVET_SIGNING_KEY
        sync: false
      - key: RIVET_KEY_ID
        value: k-2026-01
      # Comma-separated web origins, for example https://rivet.example.com
      - key: CORS_ORIGINS
        sync: false
      # Public project address; the API fetches Supabase's published signing keys from here to verify logins.
      - key: SUPABASE_URL
        value: https://dnrbjfxpirfdtmmblzct.supabase.co
      # The first administrator. Everyone else is linked by an admin through POST /admin/users/{id}/link.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      # Server-side only. Never put this in the web app or a browser.
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: EVIDENCE_BUCKET
        value: evidence
