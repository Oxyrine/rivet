services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rivet
      POSTGRES_USER: rivet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivet"]
      interval: 5s
      retries: 12
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://rivet:${POSTGRES_PASSWORD:-local-demo-only}@db/rivet
      ENV: demo
      JWT_SECRET: ${JWT_SECRET:-local-demo-only-change-before-deployment}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - provider-keys:/workspace/api/data
      - evidence-data:/workspace/data/evidence
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ./web
      args:
        API_URL: http://api:8000
    environment:
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
volumes:
  postgres-data:
  provider-keys:
  evidence-data:
